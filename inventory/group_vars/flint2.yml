---
system_manage_hostname: true
system_hostname: flint2

system_manage_timezone: true
system_zonename: Europe/Berlin
system_timezone: CET-1CEST,M3.5.0.M10.5.0/3

dropbear_manage_password_auth: true
dropbear_password_auth: "0"

dropbear_manage_root_password_auth: true
dropbear_root_password_auth: "0"

dropbear_manage_root_login: true
dropbear_root_login: "1"

packages_install:
  - nano

network_validate_lan: true
network_expected_lan_ip: 192.168.8.1
network_expected_lan_proto: static

network_manage_lan: true
network_lan_proto: static
network_lan_ipaddr: 192.168.8.1

network_manage_iot: true
network_iot_disabled: "0"
network_iot_ipaddr: 192.168.10.1
network_iot_netmask: 255.255.255.0

wireless_manage_iot: true

wireless_iot_2g_enabled: true
wireless_iot_5g_enabled: true

wireless_iot_2g_ssid: Flint2-IoT
wireless_iot_5g_ssid: Flint2-IoT-5G

wireless_iot_encryption: psk2

wireless_iot_key: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          65306262346132326466373562653437653161336561633961343466316166306632663265623636
          3933353534326636373439373762646130373164373363630a373435346231393535656136396661
          39313135323935653965616564613337323363653832323362636363376636353130396431613861
          3266616161316330640a306531633931636433313933373839306166366532313166373835646430
          65623731313961376633373738393662666635666536303265376463626133373735

dhcp_dns_manage_iot: true

dhcp_dns_iot_start: "100"
dhcp_dns_iot_limit: "150"
dhcp_dns_iot_leasetime: "12h"

firewall_manage_iot: true

firewall_iot_input: REJECT
firewall_iot_output: ACCEPT
firewall_iot_forward: REJECT

firewall_iot_wan_forwarding: true
