---
services:
  ansible:
    build: .
    working_dir: /ansible

    environment:
      ANSIBLE_CONFIG: /ansible/ansible.cfg
      ANSIBLE_PAGER: cat
    volumes:
      - type: bind
        source: .
        target: /ansible

      - type: bind
        source: ${USERPROFILE}/.ssh
        target: /keys
        read_only: true
